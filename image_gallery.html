<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Whispers & Visions | Gallery of Quotes & Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #faf8f5 0%, #f0ede8 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
            color: #2a2418;
            scroll-behavior: smooth;
        }

        /* Main container */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header & editable title */
        .gallery-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .title-wrapper {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .gallery-title {
            font-size: 2.8rem;
            font-weight: 600;
            background: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            color: #5e4b3a;
            letter-spacing: -0.02em;
            transition: all 0.2s;
        }

        .edit-title-btn,
        .theme-toggle-btn {
            background: rgba(90, 70, 55, 0.1);
            border: 1px solid rgba(90, 70, 55, 0.25);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: #5e4b3a;
            transition: all 0.2s;
            font-family: inherit;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .edit-title-btn:hover,
        .theme-toggle-btn:hover {
            background: #5e4b3a;
            color: white;
            border-color: #5e4b3a;
        }

        .subhead {
            color: #7f6b58;
            font-weight: 400;
            font-size: 1.05rem;
            margin-top: 0.25rem;
        }

        body.dark-mode {
            background: linear-gradient(145deg, #14171f 0%, #0d1016 100%);
            color: #e8eef8;
        }

        body.dark-mode .subhead {
            color: #b8c4d8;
        }

        body.dark-mode .gallery-title {
            background: linear-gradient(135deg, #f7d97f, #f1e2b3);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        body.dark-mode .edit-title-btn,
        body.dark-mode .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            color: #eceff4;
        }

        body.dark-mode .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            color: #e8edf7;
        }

        body.dark-mode .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }

        body.dark-mode .filter-btn.active {
            background: #7562ad;
            border-color: #8c79f2;
            color: white;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .gallery-item {
            background: rgba(20, 24, 32, 0.95);
            box-shadow: 0 22px 40px -16px rgba(0, 0, 0, 0.35);
        }

        body.dark-mode .image-wrapper {
            background: #1f2531;
        }

        body.dark-mode .img-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
        }

        body.dark-mode .img-category {
            background: rgba(255, 255, 255, 0.08);
            color: #eef2ff;
        }

        body.dark-mode .quote-badge {
            background: rgba(255, 255, 255, 0.12);
            color: #f5f8ff;
        }

        body.dark-mode .lightbox {
            background: rgba(7, 9, 13, 0.96);
        }

        body.dark-mode .lightbox-caption {
            background: rgba(10, 12, 18, 0.82);
            color: #e9effb;
        }

        body.dark-mode .page-btn {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.14);
            color: #e9eef8;
        }

        body.dark-mode .page-info {
            background: rgba(255, 255, 255, 0.06);
            color: #dfe6f3;
        }

        body.dark-mode .no-results {
            background: rgba(255, 255, 255, 0.04);
            color: #aeb8c9;
        }

        body.dark-mode footer {
            color: #a3afc1;
            border-top-color: rgba(255, 255, 255, 0.07);
        }

        /* Filter / Category buttons — includes QUOTES */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .filter-btn {
            background: rgba(250, 245, 240, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(110, 80, 60, 0.2);
            padding: 0.6rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #4a3727;
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .filter-btn:hover {
            background: white;
            border-color: #c9b6a2;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.05);
        }

        .filter-btn.active {
            background: #5e4b3a;
            border-color: #5e4b3a;
            color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2.5rem;
        }

        /* Gallery Item Card */
        .gallery-item {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            box-shadow: 0 18px 30px -12px rgba(0, 0, 0, 0.1);
            transition: all 0.35s cubic-bezier(0.2, 0, 0, 1);
            cursor: pointer;
            transform: translateY(0);
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 36px -14px rgba(0, 0, 0, 0.2);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
            background: #e2dbd1;
        }

        .gallery-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.4s ease;
        }

        .gallery-item:hover .gallery-img {
            transform: scale(1.04);
            filter: brightness(1.02) contrast(1.02);
        }

        /* Quote badge styling for quotes category */
        .quote-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 0.5rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fef2e6;
            font-style: italic;
            line-height: 1.35;
            pointer-events: none;
            font-family: 'Georgia', serif;
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
            text-align: center;
        }

        .img-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
            padding: 1rem 1rem 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .gallery-item:hover .img-overlay {
            opacity: 1;
        }

        .img-category {
            display: inline-block;
            background: rgba(255, 250, 240, 0.92);
            backdrop-filter: blur(4px);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            color: #2a2418;
        }

        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 16, 14, 0.94);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.25s, opacity 0.25s ease;
        }

        .lightbox.active {
            visibility: visible;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
            object-fit: contain;
            background: #1e1915;
        }

        .lightbox-caption {
            margin-top: 1rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            color: #fef0e2;
            font-weight: 450;
            font-size: 0.95rem;
            max-width: 85%;
            text-align: center;
            font-family: 'Georgia', serif;
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(30, 25, 20, 0.75);
            backdrop-filter: blur(6px);
            border: none;
            color: white;
            font-size: 2rem;
            padding: 0.6rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lb-prev { left: 1.5rem; }
        .lb-next { right: 1.5rem; }
        .lb-nav:hover {
            background: rgba(0,0,0,0.9);
            transform: translateY(-50%) scale(1.05);
        }
        .close-lightbox {
            position: absolute;
            top: 1.8rem;
            right: 2rem;
            background: rgba(0,0,0,0.65);
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-lightbox:hover {
            background: #b1624b;
            transform: scale(1.03);
        }

        /* Pagination */
        .pagination-nav {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .page-btn {
            background: white;
            border: 1px solid #decbb8;
            padding: 0.7rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .page-btn:hover:not(:disabled) {
            background: #5e4b3a;
            border-color: #5e4b3a;
            color: white;
            transform: translateY(-2px);
        }

        .page-info {
            font-size: 0.9rem;
            background: #e6dfd7;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #3a2c1f;
            font-weight: 500;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @media (max-width: 780px) {
            body { padding: 1.2rem; }
            .gallery-title { font-size: 2rem; }
            .filter-btn { padding: 0.45rem 1.1rem; font-size: 0.8rem; }
            .gallery-grid { gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .lb-prev { left: 0.5rem; }
            .lb-next { right: 0.5rem; }
            .quote-badge { font-size: 0.7rem; padding: 0.4rem 0.7rem; }
        }
        @media (max-width: 540px) {
            .gallery-grid { grid-template-columns: 1fr 1fr; gap: 0.9rem; }
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            background: rgba(0,0,0,0.02);
            border-radius: 50px;
            color: #8e7a66;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #a18d78;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 1.8rem;
        }
    </style>
</head>
<body>

<div class="gallery-container">
    <div class="gallery-header">
        <div class="title-wrapper">
            <h1 class="gallery-title" id="galleryTitle">Whispers & Visions</h1>
            <button class="edit-title-btn" id="editTitleBtn">✎ Rename</button>
            <button class="theme-toggle-btn" id="themeToggleBtn">🌙 Dark</button>
        </div>
        <div class="subhead">images that speak · soulful quotes & aesthetics</div>
    </div>

    <!-- Filter Bar: "Quotes" category (no "folder" word) -->
    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-category="all">🌿 All</button>
        <button class="filter-btn" data-category="nature">🏔️ Nature</button>
        <button class="filter-btn" data-category="urban">🌆 Urban</button>
        <button class="filter-btn" data-category="abstract">🌀 Abstract</button>
        <button class="filter-btn" data-category="portrait">👤 Portrait</button>
        <button class="filter-btn" data-category="quotes">📖 Quotes</button>
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>

    <div class="pagination-nav">
        <button class="page-btn" id="prevPageBtn">◀ Prev</button>
        <span class="page-info" id="pageIndicator">Page 1</span>
        <button class="page-btn" id="nextPageBtn">Next ▶</button>
    </div>
    <footer>✨ click any image to expand · hover for details · Quotes category includes inspiring words on images</footer>
</div>

<!-- Lightbox Modal -->
<div id="lightboxModal" class="lightbox">
    <div class="lightbox-content">
        <img id="lightboxImg" class="lightbox-img" alt="enlarged view">
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <button class="lb-nav lb-prev" id="lbPrevBtn">‹</button>
        <button class="lb-nav lb-next" id="lbNextBtn">›</button>
        <button class="close-lightbox" id="closeLightboxBtn">✕</button>
    </div>
</div>

<script>
    // ========================
    // IMAGE & QUOTES GALLERY DATA
    // Includes "quotes" category — each quote item has a beautiful image with quote text displayed on it
    // All image names are corrected and meaningful
    // ========================
    const galleryData = [
        { id: 1, src: "https://picsum.photos/id/104/500/500", title: "Aesthetic Dream Catcher", category: "abstract", quoteText: null },
        { id: 2, src: "https://picsum.photos/id/15/500/500", title: "Breathtaking View", category: "nature", quoteText: null },
        { id: 3, src: "https://picsum.photos/id/96/500/500", title: "Wireless Controller", category: "portrait", quoteText: null },
        { id: 10, src: "https://picsum.photos/id/169/500/500", title: "Dogs in Nature", category: "nature", quoteText: null },
        { id: 28, src: "https://picsum.photos/id/29/500/500", title: "Misty Mountain Peaks", category: "nature", quoteText: null },
        { id: 4, src: "https://picsum.photos/id/20/500/500", title: "Work Desk Aesthetics", category: "urban", quoteText: null },
        { id: 5, src: "https://picsum.photos/id/1/500/500", title: "Modern Workspace", category: "urban", quoteText: null },
        { id: 6, src: "https://picsum.photos/id/106/500/500", title: "Pink Flowers with Aesthetic View", category: "nature", quoteText: null },
        { id: 11, src: "https://picsum.photos/id/26/500/500", title: "Desk Essentials Flatlay", category: "urban", quoteText: null },
        { id: 29, src: "https://picsum.photos/id/47/500/500", title: "Foggy Pier View", category: "nature", quoteText: null },
        { id: 7, src: "https://picsum.photos/id/30/500/500", title: "Vintage Coffee Mug", category: "portrait", quoteText: null },
        { id: 8, src: "https://picsum.photos/id/66/500/500", title: "Misty Mountain Valley", category: "nature", quoteText: null },
        { id: 9, src: "https://picsum.photos/id/24/500/500", title: "Open Book Aesthetic", category: "portrait", quoteText: null },
        { id: 30, src: "https://picsum.photos/id/18/500/500", title: "Sunny Grass Field", category: "nature", quoteText: null },
        { id: 12, src: "https://picsum.photos/id/91/500/500", title: "Vintage Camera Portrait", category: "portrait", quoteText: null },
        { id: 13, src: "https://picsum.photos/id/83/500/500", title: "Dark Forest Evening", category: "nature", quoteText: null },
        { id: 14, src: "https://picsum.photos/id/42/500/500", title: "Cozy Café Table", category: "urban", quoteText: null },
        { id: 31, src: "https://picsum.photos/id/64/500/500", title: "Sunlit Girl Portrait", category: "portrait", quoteText: null },
        { id: 20, src: "https://picsum.photos/id/13/500/500", title: "Beach Motivation Quote", category: "quotes", quoteText: "Let your joy be in your journey — not in some distant goal." },
        { id: 21, src: "https://picsum.photos/id/27/500/500", title: "Golden Ocean Waves", category: "quotes", quoteText: "And still, I rise. — Maya Angelou" },
        { id: 22, src: "https://picsum.photos/id/35/500/500", title: "Desert Cactus Glow", category: "quotes", quoteText: "The only limit is your mind. Expand beyond." },
        { id: 23, src: "https://picsum.photos/id/39/500/500", title: "Vintage Record Player", category: "quotes", quoteText: "Do small things with great love. — Mother Teresa" },
        { id: 24, src: "https://picsum.photos/id/58/500/500", title: "Black & White Lighthouse", category: "quotes", quoteText: "Create the life you can't wait to wake up to." },
        { id: 25, src: "https://picsum.photos/id/76/500/500", title: "Rustic Bicycle Shed", category: "quotes", quoteText: "She turned her can'ts into cans and her dreams into plans." },
        { id: 26, src: "https://picsum.photos/id/152/500/500", title: "Purple Blossom Serenity", category: "quotes", quoteText: "Breathe. Believe. Become. You are enough." },
        { id: 27, src: "https://picsum.photos/id/169/500/500", title: "Peaceful Grazing Horses", category: "quotes", quoteText: "Wherever you are, be all there." },
        { id: 32, src: "https://picsum.photos/id/36/500/500", title: "Creative Workspace Flatlay", category: "quotes", quoteText: "Courage doesn't always roar. Sometimes it's the quiet voice at the end of the day saying 'I will try again tomorrow.'" },
        { id: 33, src: "https://picsum.photos/id/100/500/500", title: "Dreamy Beach Memory", category: "quotes", quoteText: "We are all stars in the sky of someone's memory." }
    ];

    // Config
    const categoryLabelMap = {
        all: "All",
        nature: "Nature",
        urban: "Urban",
        abstract: "Abstract",
        portrait: "Portrait",
        quotes: "Quote"
    };
    const itemsPerPage = 8;
    let currentPage = 1;
    let activeCategory = "all";
    let filteredItems = [...galleryData];

    // DOM elements
    const galleryGrid = document.getElementById("galleryGrid");
    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");
    const pageIndicator = document.getElementById("pageIndicator");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const galleryTitleEl = document.getElementById("galleryTitle");
    const editTitleBtn = document.getElementById("editTitleBtn");
    const themeToggleBtn = document.getElementById("themeToggleBtn");

    // Lightbox elements
    const lightboxModal = document.getElementById("lightboxModal");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const lbPrevBtn = document.getElementById("lbPrevBtn");
    const lbNextBtn = document.getElementById("lbNextBtn");
    const closeLightboxBtn = document.getElementById("closeLightboxBtn");

    let currentLightboxIndex = 0;
    let currentLightboxItems = [];

    // Rename gallery title
    function renameGallery() {
        let newName = prompt("Enter new gallery name:", galleryTitleEl.innerText);
        if (newName && newName.trim() !== "") {
            galleryTitleEl.innerText = newName.trim();
        }
    }
    editTitleBtn.addEventListener("click", renameGallery);
    themeToggleBtn.addEventListener("click", toggleTheme);

    function setThemeButtonText(theme) {
        themeToggleBtn.innerText = theme === "dark" ? "☀ Light" : "🌙 Dark";
    }

    function applyTheme(theme) {
        document.body.classList.toggle("dark-mode", theme === "dark");
        setThemeButtonText(theme);
        localStorage.setItem("galleryTheme", theme);
    }

    function toggleTheme() {
        const nextTheme = document.body.classList.contains("dark-mode") ? "light" : "dark";
        applyTheme(nextTheme);
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem("galleryTheme");
        const preferredTheme = savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        applyTheme(preferredTheme);
    }

    // Filtering logic
    function updateFilteredItems() {
        if (activeCategory === "all") {
            filteredItems = [...galleryData];
        } else {
            filteredItems = galleryData.filter(item => item.category === activeCategory);
        }
        currentPage = 1;
        renderGallery();
    }

    // Render gallery with quote badge for quotes category
    function renderGallery() {
        const totalItems = filteredItems.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        
        const startIdx = (currentPage - 1) * itemsPerPage;
        const endIdx = startIdx + itemsPerPage;
        const pageItems = filteredItems.slice(startIdx, endIdx);
        
        pageIndicator.innerText = `Page ${currentPage} of ${totalPages}`;
        prevPageBtn.disabled = (currentPage === 1);
        nextPageBtn.disabled = (currentPage === totalPages);
        
        if (pageItems.length === 0) {
            galleryGrid.innerHTML = `<div class="no-results">✨ No items in this category. Try another filter ✨</div>`;
            return;
        }
        
        let gridHtml = "";
        pageItems.forEach((item, idx) => {
            const globalIndex = startIdx + idx;
            const isQuote = (item.category === "quotes");
            
            // For quotes, display the quote text prominently on the image
            let quoteDisplayHtml = "";
            if (isQuote && item.quoteText) {
                // Truncate long quotes for badge
                let displayQuote = item.quoteText;
                if (displayQuote.length > 85) {
                    displayQuote = displayQuote.substring(0, 82) + "...";
                }
                quoteDisplayHtml = `<div class="quote-badge">“${displayQuote}”</div>`;
            }
            
            gridHtml += `
                <div class="gallery-item" data-global-idx="${globalIndex}" data-item-id="${item.id}">
                    <div class="image-wrapper">
                        <img class="gallery-img" src="${item.src}" alt="${item.title}" loading="lazy">
                        ${quoteDisplayHtml}
                        <div class="img-overlay">
                            <span class="img-category">${item.category === 'quotes' ? '💬 Quote' : categoryLabelMap[item.category]}</span>
                            <span style="display:block; color:white; font-size:0.75rem; margin-top:6px;">${item.title}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        galleryGrid.innerHTML = gridHtml;
        
        // Attach lightbox click events
        document.querySelectorAll(".gallery-item").forEach(card => {
            card.addEventListener("click", (e) => {
                const idxAttr = card.getAttribute("data-global-idx");
                if (idxAttr !== null) {
                    openLightboxByFilteredIndex(parseInt(idxAttr, 10));
                }
            });
        });
    }
    
    function openLightboxByFilteredIndex(filteredIndex) {
        if (filteredIndex < 0 || filteredIndex >= filteredItems.length) return;
        currentLightboxItems = filteredItems;
        currentLightboxIndex = filteredIndex;
        updateLightboxContent();
        lightboxModal.classList.add("active");
        document.body.style.overflow = "hidden";
    }
    
    function updateLightboxContent() {
        if (!currentLightboxItems.length) return;
        const item = currentLightboxItems[currentLightboxIndex];
        if (item) {
            lightboxImg.src = item.src;
            let captionText = `${item.title}  •  ${item.category === 'quotes' ? '💬 Quote' : categoryLabelMap[item.category]}`;
            if (item.category === "quotes" && item.quoteText) {
                captionText = `“${item.quoteText}”  —  ${item.title}`;
            }
            lightboxCaption.innerText = captionText;
        }
    }
    
    function nextLightbox() {
        if (currentLightboxItems.length === 0) return;
        currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxItems.length;
        updateLightboxContent();
    }
    
    function prevLightbox() {
        if (currentLightboxItems.length === 0) return;
        currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxItems.length) % currentLightboxItems.length;
        updateLightboxContent();
    }
    
    function closeLightbox() {
        lightboxModal.classList.remove("active");
        document.body.style.overflow = "";
    }
    
    function goPrevPage() { 
        if (currentPage > 1) { 
            currentPage--; 
            renderGallery(); 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        } 
    }
    
    function goNextPage() { 
        const totalPages = Math.ceil(filteredItems.length / itemsPerPage); 
        if (currentPage < totalPages) { 
            currentPage++; 
            renderGallery(); 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        } 
    }
    
    function setActiveFilter(category) {
        activeCategory = category;
        filterButtons.forEach(btn => {
            const btnCat = btn.getAttribute("data-category");
            if (btnCat === category) btn.classList.add("active");
            else btn.classList.remove("active");
        });
        updateFilteredItems();
    }
    
    // Event listeners
    prevPageBtn.addEventListener("click", goPrevPage);
    nextPageBtn.addEventListener("click", goNextPage);
    filterButtons.forEach(btn => {
        btn.addEventListener("click", () => setActiveFilter(btn.getAttribute("data-category")));
    });
    lbPrevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevLightbox(); });
    lbNextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextLightbox(); });
    closeLightboxBtn.addEventListener("click", closeLightbox);
    lightboxModal.addEventListener("click", (e) => { if (e.target === lightboxModal) closeLightbox(); });
    
    // Keyboard navigation for lightbox
    document.addEventListener("keydown", (e) => {
        if (lightboxModal.classList.contains("active")) {
            if (e.key === "ArrowRight") nextLightbox();
            if (e.key === "ArrowLeft") prevLightbox();
            if (e.key === "Escape") closeLightbox();
        }
    });
    
    // Initial theme and render
    loadTheme();
    updateFilteredItems();
</script>
</body>
</html>
